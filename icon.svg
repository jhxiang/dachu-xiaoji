<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3FB27F"/>
      <stop offset="52%" stop-color="#2D8F63"/>
      <stop offset="100%" stop-color="#236E52"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="0.82" cy="0.86" r="0.65">
      <stop offset="0%" stop-color="#FFB86C" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFB86C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="topGlow" cx="0.2" cy="0.16" r="0.6">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF8F0"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD18C"/>
      <stop offset="50%" stop-color="#FF9A5A"/>
      <stop offset="100%" stop-color="#FFD18C"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8F7B2"/>
      <stop offset="100%" stop-color="#5DD087"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#143D28" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#warmGlow)"/>
  <rect width="512" height="512" fill="url(#topGlow)"/>

  <!-- Decorative subtle plate ring -->
  <circle cx="256" cy="260" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="6"/>

  <!-- Chef hat + warm culinary accents -->
  <g filter="url(#shadow)">
    <path d="M168 258
             C128 254, 108 220, 122 184
             C132 158, 158 144, 184 148
             C196 112, 232 94, 268 100
             C300 105, 322 126, 330 149
             C358 144, 386 160, 394 188
             C404 222, 382 254, 344 258
             L344 316
             C344 328, 334 338, 322 338
             L190 338
             C178 338, 168 328, 168 316 Z"
          fill="url(#hat)"/>

    <!-- Warm apricot hat band -->
    <rect x="168" y="280" width="176" height="16" rx="4" fill="#FFE4CC"/>
    <line x1="216" y1="194" x2="216" y2="254" stroke="#E5DFD6" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="182" x2="256" y2="254" stroke="#E5DFD6" stroke-width="6" stroke-linecap="round"/>
    <line x1="296" y1="194" x2="296" y2="254" stroke="#E5DFD6" stroke-width="6" stroke-linecap="round"/>

    <!-- Warm coral-orange plate smile -->
    <path d="M140 374 Q256 414 372 374" fill="none" stroke="url(#plate)" stroke-width="16" stroke-linecap="round"/>
    <path d="M194 406 Q256 426 318 406" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-opacity="0.88"/>
  </g>

  <!-- Fresh herbal leaf + tiny cherry tomato accent -->
  <g transform="translate(332, 114) rotate(14)">
    <path d="M0 54 C2 20, 26 2, 62 0 C58 34, 38 56, 0 54 Z" fill="url(#leaf)"/>
    <path d="M4 50 C20 34, 36 20, 54 8" fill="none" stroke="#1E6A44" stroke-opacity="0.45" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <circle cx="144" cy="128" r="14" fill="#FF7B54" opacity="0.92"/>
  <circle cx="139" cy="123" r="4" fill="#FFFFFF" opacity="0.7"/>
</svg>
