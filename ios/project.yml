name: DachuXiaoji
options:
  bundleIdPrefix: com.dachuxiaoji
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"

targets:
  DachuXiaoji:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: DachuXiaoji
        excludes:
          - Info.plist
          - WebApp
      - path: DachuXiaoji/WebApp
        type: folder
    settings:
      base:
        INFOPLIST_FILE: DachuXiaoji/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.dachuxiaoji.app
        PRODUCT_NAME: DachuXiaoji
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
